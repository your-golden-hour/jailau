<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Жайлау — бесплатная платформа, соединяющая сёла и таксистов рядом с Шымкентом. Jailau connects rural villages with local taxi drivers.">
  <meta name="theme-color" content="#0E0E0E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jailau">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Jailau — Жайлау</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app-shell">
    <header id="topbar" class="topbar">
      <div class="topbar-left">
        <img src="icon.svg" alt="" class="topbar-logo">
        <span class="brand-copy"><span class="topbar-title" data-i18n="app_name">Жайлау</span><span class="brand-subtitle" data-i18n="brand_subtitle">Поездки рядом</span></span>
      </div>
      <div class="topbar-right">
        <a class="header-link" href="#/terms" data-i18n="terms_link" data-i18n-aria="terms_link">Условия и конфиденциальность</a>
        <button id="lang-toggle" class="btn btn-ghost btn-lang" type="button" data-i18n-aria="switch_language" aria-label="Сменить язык">KZ</button>
      </div>
    </header>

    <main id="screen" class="screen" role="main"></main>

    <nav id="bottom-nav" class="bottom-nav" data-i18n-aria="main_navigation" aria-label="Основная навигация"></nav>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Load order matters: config -> i18n -> real API -> screens -> app. -->
  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/supabase-api.js"></script>
  <script src="js/screens/auth.js"></script>
  <script src="js/screens/profile.js"></script>
  <script src="js/screens/passenger.js"></script>
  <script src="js/screens/driver.js"></script>
  <script src="js/screens/admin.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Register the offline shell service worker (harmless on file:// or unsupported browsers)
    if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("service-worker.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
